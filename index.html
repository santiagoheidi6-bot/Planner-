<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#150d26"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Mi Planner</title>
<style>
:root{--bg:#150d26;--p1:#2a1b4a;--p2:#4c2f8a;--p3:#8b5cf6;--p4:#c4b5fd;--p5:#ede9fe;--mu:#a99bd0;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--p5);font:15px/1.4 system-ui,sans-serif;padding:0 0 90px}
header{position:sticky;top:0;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--p1);z-index:5}
.r{display:flex;align-items:center;justify-content:space-between;gap:8px}#ttl{text-align:center;text-transform:capitalize;font-size:16px}
button{background:var(--p2);color:#fff;border:0;border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}button.sec{background:var(--p1);color:var(--p4)}button.dng{background:none;color:var(--p4);border:1px solid var(--p2);width:100%;margin-top:8px}
.chip{font-size:12px;color:var(--p4);background:var(--p1);border-radius:20px;padding:6px 10px}
main{padding:12px 14px;max-width:640px;margin:auto}.note{color:var(--mu);font-size:13px}
.sum,.card{background:var(--p1);border-radius:16px;padding:14px;margin-bottom:12px}.sum b{font-size:26px;color:var(--p4)}.sum small{display:block;color:var(--mu)}
.bar{height:8px;background:#150d26;border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--p4));transition:width .4s}
.it{display:grid;grid-template-columns:62px 20px 1fr 44px;align-items:center;position:relative;padding:8px 0}
.it::before{content:"";position:absolute;left:71px;top:0;bottom:0;width:2px;background:var(--p2)}
.tm{text-align:right;font-size:12px;color:var(--mu);padding-right:6px}.tm small{font-size:11px}
.dc{display:flex;justify-content:center;z-index:1}.dot{width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--p3);transition:.3s}
.bd{background:var(--p1);border-left:3px solid var(--p3);border-radius:10px;padding:8px 10px;margin:0 8px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.nm{font-weight:500}.tg{font-size:11px;color:var(--mu)}.ed{background:none;padding:2px 6px;color:var(--p4)}
.ck{width:36px;height:36px;border-radius:50%;background:none;border:2px solid var(--p3);padding:0;color:#fff;font-size:18px;transition:.25s}
.completada .dot{background:var(--p4);border-color:var(--p4);box-shadow:0 0 12px 3px rgba(196,181,253,.7)}
.completada .ck{background:var(--p3);transform:scale(1.08)}
.cancelada{opacity:.45}.cancelada .nm{text-decoration:line-through}
nav{position:fixed;bottom:0;left:0;right:0;background:#1d1236;display:flex;justify-content:space-around;padding:8px;border-top:1px solid var(--p1);z-index:6}
nav button{background:none;color:var(--mu)}nav button.on{color:var(--p4)}nav .add{background:var(--p3);color:#fff;border-radius:24px}
dialog{background:var(--p1);color:var(--p5);border:1px solid var(--p2);border-radius:18px;width:min(92vw,460px);padding:16px;max-height:90vh}dialog::backdrop{background:#000a}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0}input,select,textarea{width:100%;background:var(--bg);color:var(--p5);border:1px solid var(--p2);border-radius:10px;padding:10px;font:inherit;margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kp{background:var(--p1);border-radius:14px;padding:12px}.kp b{font-size:22px;color:var(--p4);display:block}.kp small{color:var(--mu)}
.ch{display:flex;gap:3px;align-items:flex-end;height:110px;overflow-x:auto;padding-top:6px}.cb{flex:1;min-width:8px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.cb i{display:block;width:100%;background:linear-gradient(var(--p4),var(--p2));border-radius:4px 4px 0 0;min-height:2px}.cb small{font-size:9px;color:var(--mu)}
h3{margin:0 0 8px;font-size:15px;color:var(--p4)}details{color:var(--mu)}summary{cursor:pointer;color:var(--p4)}.row{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}
.ws{display:flex;gap:4px;margin-bottom:10px}.wd{flex:1;padding:6px 0;font-size:11px;background:var(--p1);color:var(--mu);border-radius:10px}.wd b{display:block;font-size:15px}.wd.on{background:var(--p3);color:#fff}.wd:disabled{opacity:.3}
.grid{position:relative;margin-top:8px}.hr{position:absolute;left:0;right:0;border-top:1px solid #2a1b4a}.hr span{position:absolute;top:-8px;left:0;width:48px;font-size:10px;color:var(--mu);background:var(--bg)}
.bks{position:absolute;left:52px;right:0;top:0;bottom:0}
.bk{position:absolute;background:color-mix(in srgb,var(--c) 22%,var(--bg));border-left:4px solid var(--c);border-radius:8px;padding:4px 40px 4px 8px;overflow:hidden;transition:.3s}
.bk .ck{position:absolute;right:5px;top:4px;width:28px;height:28px;border-color:var(--c);font-size:15px}
.bk.completada{box-shadow:0 0 14px 2px color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 38%,var(--bg))}.bk.completada .ck{background:var(--c)}
.now{position:absolute;left:44px;right:0;height:2px;background:#f472b6;z-index:3}
.sws,.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.sw{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid transparent}.sw.on{border-color:#fff}
.dy{padding:8px 11px;background:var(--p1);color:var(--mu)}.dy.on{background:var(--p3);color:#fff}.ch2{display:inline-block;background:var(--p2);border-radius:12px;padding:3px 9px;margin:4px 4px 0 0;font-size:12px}
.fab{position:fixed;right:16px;bottom:78px;width:56px;height:56px;border-radius:50%;font-size:30px;padding:0;background:var(--p3);box-shadow:0 4px 14px #0008;z-index:7}
.bdg{display:inline-block;margin:6px 0 0 8px;padding:3px 10px;border-radius:12px;font-size:12px;vertical-align:middle}.bdg.prod{background:#14532d;color:#bbf7d0}.bdg.low{background:#7c2d12;color:#fed7aa}.bdg.prog{background:var(--p2);color:var(--p5)}
.sd{display:block;width:6px;height:6px;border-radius:50%;margin:2px auto 0}.sd.prod{background:#22c55e}.sd.low{background:#f97316}.sd.prog{background:var(--p4)}.gc{background:var(--p1);border-radius:16px;padding:14px;margin-bottom:12px;border-left:4px solid var(--c)}.gb{position:relative;height:12px;background:#150d26;border-radius:8px;overflow:hidden;margin:8px 0}.gb i{display:block;height:100%;background:var(--c);transition:width .4s}.mk{position:absolute;top:0;bottom:0;width:2px;background:#fff}.bk{user-select:none;-webkit-user-select:none;touch-action:manipulation}.bk.mv{outline:2px dashed #fff;z-index:5;touch-action:none;cursor:grab;box-shadow:0 0 16px var(--c)}#tst{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:var(--p2);color:#fff;padding:10px 14px;border-radius:14px;z-index:9;box-shadow:0 4px 14px #0008;font-size:14px}#tst button{background:var(--bg);margin-left:8px;padding:6px 10px}.bk.sm{white-space:nowrap;text-overflow:ellipsis;padding-top:7px}.bk.sm .nm,.bk.sm .tg{display:inline;font-size:13px}.bk.sm .tg{margin-left:8px}.bk.sm .ck{top:6px}</style></head><body>
<header><div class=r><button class=sec id=prev>‹</button><div id=ttl></div><button class=sec id=next>›</button></div>
<div class=r style="margin-top:8px"><button class=sec id=today>Hoy</button><span class=chip id=sync></span></div></header>
<main id=v></main>
<nav><button data-v=tl>Agenda</button><button data-v=db>Dashboard</button><button data-v=sg>Sueños</button><button data-v=st>Ajustes</button></nav><button class=fab id=add aria-label="Añadir actividad">+</button>
<div id=tst></div><dialog id=m><div id=mf></div></dialog>
<script>
const PI='2020-01-01',PF='2040-12-31',K='plannerV1',$=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{acts:[],hist:[],routines:[],url:'',key:'',err:''};S.del=S.del||[];
if(!S.goals)S.goals=[{id:'g1',name:'Cocina',target:1200,min:0,due:'2026-12-25',color:'#f97316',adds:[]},{id:'g2',name:'Laptop',target:3500,min:0,due:'2027-02-28',color:'#3b82f6',adds:[]},{id:'g3',name:'Ciclos de la universidad',target:7600,min:3800,due:'2027-03-31',color:'#8b5cf6',adds:[]}];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('No se pudo guardar en el dispositivo: '+e)}};
const lima=()=>new Date(Date.now()-5*36e5).toISOString().slice(0,10);
const nowL=()=>new Date(Date.now()-5*36e5).toISOString().slice(0,19)+'-05:00';
const addD=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const dow=d=>new Date(d+'T00:00:00Z').getUTCDay(),wk=d=>addD(d,-((dow(d)+6)%7));
const clamp=d=>d<PI?PI:d>PF?PF:d;
const ft=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return((h%12)||12)+':'+String(m).padStart(2,'0')+(h<12?' a. m.':' p. m.')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lbl=d=>new Date(d+'T12:00:00Z').toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
const get=id=>S.acts.find(x=>x.id===id),cats=()=>[...new Set(S.acts.map(a=>a.cat).filter(Boolean))];
let cur=clamp(lima()),view='tl',dr='dia',dc='',tmr,busy=0;
const THR=()=>S.thr||70;
function dayState(d,B){const m=calc((B||S.acts).filter(a=>a.date===d));if(m.pct==null||d>lima())return'none';if(m.pct>=THR())return'prod';return d===lima()?'prog':'low'}
const BT={prod:'✅ Día productivo',low:'🌱 Día con menor avance',prog:'⏳ Día en progreso',none:''};
const sortF=(a,b)=>a.start.localeCompare(b.start)||(a.end||'').localeCompare(b.end||'')||a.created.localeCompare(b.created);
const day=d=>S.acts.filter(a=>a.date===d).sort(sortF);
function calc(L){const t=L.length,can=L.filter(a=>a.status==='cancelada').length,done=L.filter(a=>a.status==='completada').length,comp=t-can;
 return{tot:t,can,done,comp,pend:comp-done,res:L.filter(a=>a.resched>0).length,unp:L.filter(a=>a.type==='imprevista').length,pct:comp?Math.round(done/comp*100):null}}
const pt=m=>m.pct==null?'Sin datos':m.pct+' %';
function touch(x){x.v=(x.v||0)+1;x.d=1;save();clearTimeout(tmr);tmr=setTimeout(sync,1500)}
function log(o,a,reason){if(o.date===a.date&&o.start===a.start&&o.status===a.status)return;
 S.hist.push({hid:uid(),id:a.id,at:nowL(),oldT:o.date+' '+o.start,newT:a.date+' '+a.start,oldS:o.status,newS:a.status,reason:reason||'',d:1});save()}
function tg(id){const a=get(id);if(a.status==='cancelada')return;
 if(a.date<lima()&&!confirm('Este día ya pasó. ¿Cambiar el check?'))return;
 const o={...a};a.status=a.status==='completada'?'pendiente':'completada';a.doneAt=a.status==='completada'?nowL():'';touch(a);log(o,a,'');render()}
function cn(id){if(!confirm('¿Cancelar esta actividad? No contará como incumplida.'))return;const a=get(id),o={...a};a.status='cancelada';touch(a);log(o,a,'Cancelada');$('#m').close();render()}
const PAL=[['Morado','#8b5cf6'],['Rosa','#ec4899'],['Azul','#3b82f6'],['Verde','#22c55e'],['Naranja','#f97316'],['Amarillo','#eab308'],['Rojo','#ef4444'],['Turquesa','#14b8a6'],['Gris','#9ca3af']];
const col=a=>a.color||'#8b5cf6',HP=88,mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
function layout(L){const it=L.map(a=>({a,s:mins(a.start),e:Math.max(mins(a.end||a.start),mins(a.start)+30)}));let cl=[],cu=null,ce=-1;
 it.forEach(x=>{if(x.s>=ce){cu=[];cl.push(cu);ce=x.e}else ce=Math.max(ce,x.e);cu.push(x)});
 cl.forEach(c=>{const en=[];c.forEach(x=>{let i=en.findIndex(e=>e<=x.s);if(i<0){i=en.length;en.push(0)}en[i]=x.e;x.c=i});c.forEach(x=>x.n=en.length)});return it}
function tl(){const L=day(cur),m=calc(L),past=cur<lima(),it=layout(L),h0=0,h1=24;
 const names=f=>L.filter(f).map(a=>esc(a.name)).join(', ')||'—',ws=wk(cur);
 const strip=[0,1,2,3,4,5,6].map(i=>{const d=addD(ws,i),ok=d>=PI&&d<=PF;return`<button class="wd ${d===cur?'on':''}" ${ok?'':'disabled'} onclick="cur='${d}';render()">${'lun mar mié jue vie sáb dom'.split(' ')[i]}<b>${+d.slice(8)}</b><i class="sd ${dayState(d)}"></i></button>`}).join('');
 let g='';for(let h=h0;h<h1;h++)g+=`<div class=hr style="top:${(h-h0)*HP}px"><span>${ft(String(h).padStart(2,'0')+':00').replace(':00','')}</span></div>`;
 const B=it.map(x=>{const a=x.a,w=100/x.n;return`<div class="bk ${a.status}${a.id===MV?' mv':''}${(x.e-x.s)*HP/60<58?' sm':''}" data-id="${a.id}" style="top:${(x.s-h0*60)*HP/60}px;height:${(x.e-x.s)*HP/60-2}px;left:calc(${x.c*w}% + 2px);width:calc(${w}% - 4px);--c:${col(a)}"><div class=nm>${esc(a.name)}</div><div class=tg>${ft(a.start)}${a.end?' – '+ft(a.end):''}${a.rid?' 🔁':''}${a.type==='imprevista'?' · imprevista':''}${a.resched>0&&a.status==='pendiente'?' · reprogramada':''}${a.status==='cancelada'?' · cancelada':''}</div><button class=ck aria-label=Completar onclick="event.stopPropagation();tg('${a.id}')">${a.status==='completada'?'✓':''}</button></div>`}).join('');
 let nl='';if(cur===lima()){const n=mins(nowL().slice(11,16));if(n>=h0*60&&n<h1*60)nl=`<div class=now style="top:${(n-h0*60)*HP/60}px"></div>`}
 $('#v').innerHTML=`<div class=ws>${strip}</div><div class=sum><b>${pt(m)}</b>${dayState(cur)!=='none'?`<span class="bdg ${dayState(cur)}">${BT[dayState(cur)]}</span>`:''}<small>${m.done} de ${m.comp} completadas${m.unp?' · '+m.unp+' imprevistas':''}</small><div class=bar><i style="width:${m.pct||0}%"></i></div></div>`+(past?'<p class=note>Día pasado: te pediré confirmar antes de cambiar un check.</p>':'')+
 (L.length?'':'<p class=note>Sin actividades. Pulsa + para añadir.</p>')+`<div class=grid style="height:${(h1-h0)*HP}px">${g}<div class=bks>${B}</div>${nl}</div>`+
 (L.length?`<details class=card style="margin-top:12px"><summary>Resumen del día</summary><p class=note>Completadas: ${names(a=>a.status==='completada')}<br>Pendientes: ${names(a=>a.status==='pendiente')}<br>Imprevistos: ${names(a=>a.type==='imprevista')}<br>Reprogramadas: ${names(a=>a.resched>0)}<br>Cada día es una oportunidad para aprender y ajustar tu plan.</p></details>`:'')}
function rng(){if(dr==='dia')return[cur,cur];if(dr==='sem'){const a=wk(cur);return[a,addD(a,6)]}if(dr==='mes')return[cur.slice(0,7)+'-01',cur.slice(0,7)+'-31'];const ds=S.acts.map(x=>x.date).sort();return ds.length?[ds[0],ds[ds.length-1]]:[cur,cur]}
const bars=I=>`<div class=ch>${I.map(i=>`<div class=cb title="${i.l}: ${i.p==null?'Sin datos':i.p+' %'}"><i style="height:${i.p||0}%"></i>${I.length<=14?'<small>'+i.l+'</small>':''}</div>`).join('')}</div>`;
function db(){const base=S.acts.filter(x=>!dc||(x.cat||'Sin categoría')===dc),[a,b]=rng(),L=base.filter(x=>x.date>=a&&x.date<=b),m=calc(L),P=calc(base);const dts=[...new Set(L.map(x=>x.date))],stt=dts.map(x=>dayState(x,base)),pd=stt.filter(s=>s==='prod').length,md=stt.filter(s=>s!=='none').length;let rk=0;for(let i=0,x=lima();i<400;i++,x=addD(x,-1)){const s=dayState(x);if(s==='prod')rk++;else if(s==='low')break}
 const e0=b>PF?PF:b,s0=a<PI?PI:a,days=[];for(let d=s0<addD(e0,-61)?addD(e0,-61):s0;d<=e0;d=addD(d,1))days.push(d);
 const dayI=days.map(d=>({l:d.slice(8),p:calc(base.filter(x=>x.date===d)).pct}));
 const weeks=[];for(let i=7;i>=0;i--){const w=addD(wk(cur),-7*i);weeks.push({l:w.slice(8),p:calc(base.filter(x=>x.date>=w&&x.date<=addD(w,6))).pct})}
 const MN='ene feb mar abr may jun jul ago sep oct nov dic'.split(' '),mon=[];for(let i=5;i>=0;i--){const t=new Date(cur.slice(0,7)+'-01T00:00:00Z');t.setUTCMonth(t.getUTCMonth()-i);const k=t.toISOString().slice(0,7);mon.push({l:MN[+k.slice(5)-1],p:calc(base.filter(x=>x.date.startsWith(k))).pct})}
 const g={};S.acts.filter(x=>x.date>=a&&x.date<=b).forEach(x=>(g[x.cat||'Sin categoría']=g[x.cat||'Sin categoría']||[]).push(x));
 const cl=Object.entries(g).map(([k,v])=>[k,calc(v),col(v[0])]).sort((x,y)=>(y[1].pct||-1)-(x[1].pct||-1));
 $('#v').innerHTML=`<div class=g2><select onchange="dr=this.value;render()">${[['dia','Día'],['sem','Semana'],['mes','Mes'],['per','Todo']].map(([k,l])=>`<option value=${k} ${dr===k?'selected':''}>${l}</option>`).join('')}</select><select onchange="dc=this.value;render()"><option value="">Todas las categorías</option>${[...cats(),'Sin categoría'].map(c=>`<option ${dc===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div style="height:10px"></div>
 <div class=g3><div class=kp><b>${pt(m)}</b><small>Cumplimiento</small></div><div class=kp><b>${pt(P)}</b><small>Total acumulado</small></div><div class=kp><b>${m.comp}</b><small>Planificadas (computables)</small></div><div class=kp><b>${m.done}</b><small>Completadas</small></div><div class=kp><b>${m.pend}</b><small>Pendientes</small></div><div class=kp><b>${m.res}</b><small>Reprogramadas</small></div><div class=kp><b>${m.can}</b><small>Canceladas</small></div><div class=kp><b>${m.unp}</b><small>Imprevistas</small></div><div class=kp><b>${pd} de ${md}</b><small>Días productivos</small></div><div class=kp><b>${rk}</b><small>Racha de días productivos</small></div></div>
 <div class=card><h3>Planificadas vs completadas</h3><div class=row><span>Computables</span><span>${m.comp}</span></div><div class=bar><i style="width:${m.comp?100:0}%"></i></div><div class=row><span>Completadas</span><span>${m.done}</span></div><div class=bar><i style="width:${m.pct||0}%"></i></div></div>
 <div class=card><h3>Evolución diaria</h3>${bars(dayI)}</div><div class=card><h3>Últimas 8 semanas (día de inicio)</h3>${bars(weeks)}</div><div class=card><h3>Últimos 6 meses</h3>${bars(mon)}</div>
 <div class=card><h3>Categorías</h3>${cl.map(([k,v,cc])=>`<div class=row><span>${esc(k)}</span><span>${pt(v)}</span></div><div class=bar><i style="width:${v.pct||0}%;background:${cc}"></i></div>`).join('')||'<p class=note>Sin datos</p>'}</div>
 <details class=card><summary>¿Cómo se calcula?</summary><p class=note>Computables = actividades no canceladas. Cumplimiento = completadas ÷ computables × 100. Las pendientes no cuentan como completadas; las canceladas salen del denominador. Una actividad reprogramada es un solo registro (cuenta solo en su fecha actual) y se marca como reprogramada. Sin computables se muestra «Sin datos». Un día es productivo cuando su cumplimiento llega al umbral que fijes en Ajustes (por defecto 70 %); hoy se muestra «en progreso» hasta que lo alcances. La racha cuenta días productivos seguidos; los días sin datos no la rompen.</p></details>`}
function st(){$('#v').innerHTML=`<div class=card><h3>Google Sheets</h3><label>URL de la aplicación web (Apps Script)<input id=su value="${esc(S.url)}"></label><label>Clave secreta<input id=sk value="${esc(S.key)}"></label><button onclick=ss()>Guardar y sincronizar</button><p class=note>${S.err?'Último error: '+esc(S.err):''}</p></div><div class=card><h3>Día productivo</h3><label>Un día es productivo si completas al menos (%)<input id=sth type=number min=1 max=100 value="${THR()}" onchange="sth()"></label></div><div class=card><button class=sec onclick=bk()>Descargar copia JSON</button><p class=note>${S.acts.length} actividades guardadas en este dispositivo.</p></div>`}
function sth(){S.thr=Math.min(100,Math.max(1,+$('#sth').value||70));save();render()}
async function ss(){S.url=$('#su').value.trim();S.key=$('#sk').value.trim();[S.acts,S.hist,S.routines].forEach(l=>l.forEach(x=>x.d=1));save();await sync();await pull();st()}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='planner-respaldo-'+lima()+'.json';a.click()}
function rm(id){if(!confirm('¿Eliminar esta actividad por completo? No se podrá recuperar.'))return;
 const a=get(id),all=a.rid&&confirm('Esta actividad se repite.\nAceptar = eliminar también las siguientes de la serie.\nCancelar = eliminar solo esta.'),T=all?S.acts.filter(x=>x.rid===a.rid&&x.date>=a.date):[a];
 T.forEach(t=>{S.hist.push({hid:uid(),id:t.id,at:nowL(),oldT:t.date+' '+t.start,newT:'',oldS:t.status,newS:'eliminada',reason:'Eliminada: '+t.name,d:1});S.del.push(t.id)});
 const ids=T.map(t=>t.id);S.acts=S.acts.filter(x=>!ids.includes(x.id));save();clearTimeout(tmr);tmr=setTimeout(sync,1500);$('#m').close();render()}
function dup(f,id){return S.acts.some(a=>a.id!==id&&a.date===f.date&&a.start===f.start&&a.name.toLowerCase()===f.name.toLowerCase()&&a.status!=='cancelada')}
let EX=[],DS=[],CC='#8b5cf6';
function pc(h,b){CC=h;document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b))}
function td(n,b){DS=DS.includes(n)?DS.filter(x=>x!==n):[...DS,n];b.classList.toggle('on')}
function rp(){const p=$('#fp').value;$('#cd').style.display=p==='c'?'flex':'none';$('#ro').style.display=p==='n'?'none':'block'}
function ex(){const x=$('#fx').value;if(x&&!EX.includes(x)){EX.push(x);exl()}$('#fx').value=''}
function exl(){$('#exl').innerHTML=EX.sort().map(x=>`<span class=ch2 onclick="EX=EX.filter(y=>y!=='${x}');exl()">${x.slice(8)}/${x.slice(5,7)} ✕</span>`).join('')}
function openF(id){const a=id?get(id):null,v=a||{date:cur,start:'',end:'',name:'',cat:'',notes:'',type:'planificada'};CC=col(v);EX=[];DS=[];
 const DL=[['L',1],['M',2],['X',3],['J',4],['V',5],['S',6],['D',0]];
 $('#mf').innerHTML=`<h3>${a?'Editar':'Añadir'} actividad</h3><label>Fecha<input id=fd type=date min=${PI} max=${PF} value=${v.date}></label><div class=g2><label>Inicio<input id=fs type=time value="${v.start}"></label><label>Fin (opcional)<input id=fe type=time value="${v.end||''}"></label></div><label>Actividad<input id=fn value="${esc(v.name)}"></label><label>Color</label><div class=sws>${PAL.map(([n,h])=>`<button class="sw ${h===CC?'on':''}" style="background:${h}" aria-label=${n} onclick="pc('${h}',this)"></button>`).join('')}</div><label>Categoría (opcional)<input id=fc list=cl value="${esc(v.cat)}"><datalist id=cl>${cats().map(c=>`<option>${esc(c)}`).join('')}</datalist></label><label>Observaciones (opcional)<textarea id=fo>${esc(v.notes)}</textarea></label><label>Tipo<select id=fy><option value=planificada>Planificada<option value=imprevista ${v.type==='imprevista'?'selected':''}>Imprevista</select></label>${a?'<label>Motivo del cambio (opcional)<input id=fr></label>':`<label>Repetir<select id=fp onchange="rp()"><option value=n>No se repite<option value=d>Todos los días<option value=w>Lunes a viernes<option value=s>Cada semana (mismo día)<option value=c>Personalizado</select></label><div id=cd class=days style="display:none">${DL.map(([l,n])=>`<button class=dy onclick="td(${n},this)">${l}</button>`).join('')}</div><div id=ro style="display:none"><label>Repetir hasta<input id=fu type=date min=${PI} max=${PF} value=${clamp(addD(v.date,90))}></label><label>Omitir fechas (opcional)</label><div class=g2><input id=fx type=date min=${PI} max=${PF}><button class=sec onclick="ex()">Omitir</button></div><div id=exl></div></div>`}<div class=g2 style="margin-top:10px"><button onclick="sv('${id||''}')">Guardar</button><button class=sec onclick="$('#m').close()">Cerrar</button></div>${a?`<button class=dng onclick="cn('${id}')">Cancelar actividad (queda marcada)</button><button class=dng onclick="rm('${id}')">Eliminar actividad definitivamente</button>`:''}`;$('#m').showModal()}
function sv(id){const d=$('#fd').value,s=$('#fs').value,n=$('#fn').value.trim(),e=$('#fe').value;
 if(!d||!s||!n)return alert('Faltan fecha, hora de inicio o nombre.');if(d<PI||d>PF)return alert('Fecha fuera del rango permitido (2020–2040).');if(e&&e<s)return alert('La hora final es anterior al inicio.');
 const f={name:n,start:s,end:e,cat:$('#fc').value.trim(),notes:$('#fo').value.trim(),type:$('#fy').value,color:CC};
 if(dup({...f,date:d},id))return alert('Ya existe esa actividad a esa hora.');
 if(id){const a=get(id),all=a.rid&&confirm('Esta actividad se repite.\nAceptar = aplicar el cambio a esta y a las siguientes.\nCancelar = solo a esta.'),T=all?S.acts.filter(x=>x.rid===a.rid&&x.date>=a.date):[a];
  T.forEach(t=>{const o={...t};Object.assign(t,f);if(t===a){t.date=d;if(o.date!==d||o.start!==s){t.resched=(t.resched||0)+1;t.orig=t.orig||o.date+' '+o.start}}touch(t);log(o,t,$('#fr').value)})}
 else{const p=$('#fp').value,u=p==='n'?d:($('#fu').value||PF);
  if(p==='c'&&!DS.length)return alert('Marca al menos un día de la semana.');if(u<d||u>PF)return alert('La fecha final no es válida.');if((new Date(u)-new Date(d))/864e5>1100&&!confirm('Vas a crear muchas actividades (más de 3 años). ¿Continuar?'))return;
  const dy=p==='d'?[0,1,2,3,4,5,6]:p==='w'?[1,2,3,4,5]:p==='s'?[dow(d)]:DS,rid=p==='n'?'':uid();
  if(p!=='n')S.routines.push({id:rid,name:n,start:s,end:e,days:dy,from:d,to:u,status:'activa',exc:[...EX],d:1,v:1});
  let c=0;for(let x=d;x<=u;x=addD(x,1)){if(p!=='n'&&(!dy.includes(dow(x))||EX.includes(x)))continue;const nf={...f,date:x};if(dup(nf))continue;const a={id:uid(),...nf,status:'pendiente',created:nowL(),doneAt:'',resched:0,orig:'',rid};S.acts.push(a);touch(a);c++}
  if(!c){S.routines=S.routines.filter(r=>r.id!==rid);return alert('No se creó ninguna actividad con esos días.')}cur=clamp(d)}
 save();$('#m').close();render()}
const pend=()=>S.acts.filter(x=>x.d).length+S.hist.filter(x=>x.d).length+S.routines.filter(x=>x.d).length+S.del.length;
function chip(t){const n=pend(),c=$('#sync');c.textContent=t||(!S.url?'Sin Google Sheets':(S.err||n)?`⏳ ${n} pendiente(s) · reintentar`:'✓ Sincronizado')}
async function sync(){if(!S.url||busy||!navigator.onLine)return chip();
 const A=S.acts.filter(x=>x.d).map(x=>({...x})),H=S.hist.filter(x=>x.d).map(x=>({...x})),R=S.routines.filter(x=>x.d).map(x=>({...x})),D=[...S.del];
 if(!A.length&&!H.length&&!R.length&&!D.length)return chip();busy=1;chip('Sincronizando…');
 try{const r=await fetch(S.url,{method:'POST',body:JSON.stringify({key:S.key,acts:A,hist:H,routines:R,del:D})}),j=await r.json();if(!j.ok)throw j.error||'Error';
  A.forEach(s=>{const x=get(s.id);if(x&&x.v===s.v)x.d=0});H.forEach(s=>{const x=S.hist.find(h=>h.hid===s.hid);if(x)x.d=0});S.del=S.del.filter(i=>!D.includes(i));R.forEach(s=>{const x=S.routines.find(h=>h.id===s.id);if(x&&x.v===s.v)x.d=0});S.err='';save()}
 catch(e){S.err=String(e);save()}busy=0;chip()}
async function pull(){if(!S.url||!navigator.onLine)return;
 try{const r=await fetch(S.url+'?key='+encodeURIComponent(S.key)),j=await r.json();if(!j.ok)throw j.error||'Error';
  j.acts.forEach(q=>{if(S.del.includes(q.id))return;const i=S.acts.findIndex(x=>x.id===q.id);if(i>=0&&S.acts[i].d)return;const n={...q,resched:+q.resched||0,v:0,d:0};if(i>=0)S.acts[i]=n;else S.acts.push(n)});
  j.hist.forEach(h=>{if(!S.hist.some(x=>x.hid===h.hid))S.hist.push({...h,d:0})});
  j.routines.forEach(q=>{if(!S.routines.some(x=>x.id===q.id))S.routines.push({...q,d:0,v:0})});S.err='';save();render()}
 catch(e){S.err=String(e);chip()}}
const mny=n=>'S/ '+Number(n||0).toLocaleString('es-PE',{maximumFractionDigits:2}),sv0=g=>(g.adds||[]).reduce((s,x)=>s+x.amt,0),dleft=g=>Math.round((new Date(g.due)-new Date(lima()))/864e5);
function need(g,t){const rem=Math.max(t-sv0(g),0),dl=dleft(g);if(!rem)return'';if(dl<=0)return`plazo vencido, faltan ${mny(rem)}`;return`${mny(Math.ceil(rem/Math.max(dl/30.44,1)))} al mes · ${mny(Math.ceil(rem/Math.max(dl/7,1)))} por semana`}
const gcard=g=>{const s=sv0(g),p=Math.min(100,Math.round(s/g.target*100)),mp=g.min?Math.min(100,Math.round(g.min/g.target*100)):0,dl=dleft(g),done=s>=g.target;
 return`<div class=gc style="--c:${g.color||'#8b5cf6'}"><div class=r><b>${esc(g.name)}</b><button class=ed onclick="openG('${g.id}')">✎</button></div><div class=tg>Meta ${mny(g.target)} · para el ${g.due.split('-').reverse().join('/')}${dl>0?' ('+dl+' días)':''}</div><div class=gb><i style="width:${p}%"></i>${mp?`<span class=mk style="left:${mp}%"></span>`:''}</div><div class=r><span>${mny(s)} <small>(${p} %)</small></span><span>${done?'🎉 ¡Lograda!':'faltan '+mny(g.target-s)}</span></div>${g.min?`<p class=note>Mínimo ${mny(g.min)}: ${s>=g.min?'✅ alcanzado':need(g,g.min)}</p>`:''}${done?'':`<p class=note>Para el total: ${need(g,g.target)}</p>`}<button onclick="openA('${g.id}')">+ Abonar</button><details style="margin-top:8px"><summary>Abonos (${(g.adds||[]).length})</summary>${(g.adds||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class=row><span>${x.date.slice(8)}/${x.date.slice(5,7)} ${esc(x.note||'')}</span><span>${mny(x.amt)} <button class=ed onclick="da('${g.id}','${x.id}')">✕</button></span></div>`).join('')||'<p class=note>Sin abonos aún.</p>'}</details></div>`};
function sg(){const G=[...S.goals].sort((a,b)=>a.due.localeCompare(b.due)),T=G.reduce((s,g)=>s+g.target,0),A=G.reduce((s,g)=>s+Math.min(sv0(g),g.target),0);
 $('#v').innerHTML=`<div class=sum><b>${mny(A)}</b><small>ahorrados de ${mny(T)} · faltan ${mny(Math.max(T-A,0))}</small><div class=bar><i style="width:${T?Math.round(A/T*100):0}%"></i></div></div>`+G.map(gcard).join('')+(G.length?'':'<p class=note>Aún no tienes sueños. Pulsa + para añadir uno.</p>')}
function openG(id){const g=id?S.goals.find(x=>x.id===id):null,v=g||{name:'',target:'',min:'',due:'',color:'#8b5cf6'};CC=v.color||'#8b5cf6';
 $('#mf').innerHTML=`<h3>${g?'Editar':'Nuevo'} sueño</h3><label>Nombre<input id=gn value="${esc(v.name)}"></label><label>Monto total (S/)<input id=gt type=number min=1 value="${v.target}"></label><label>Meta mínima (opcional, S/)<input id=gm type=number min=0 value="${v.min||''}"></label><label>Fecha límite<input id=gd type=date value="${v.due}"></label><label>Color</label><div class=sws>${PAL.map(([n,h])=>`<button class="sw ${h===CC?'on':''}" style="background:${h}" aria-label=${n} onclick="pc('${h}',this)"></button>`).join('')}</div><div class=g2><button onclick="svG('${id||''}')">Guardar</button><button class=sec onclick="$('#m').close()">Cerrar</button></div>${g?`<button class=dng onclick="rgl('${id}')">Eliminar sueño</button>`:''}`;$('#m').showModal()}
function svG(id){const n=$('#gn').value.trim(),t=+$('#gt').value,m=+$('#gm').value||0,d=$('#gd').value;
 if(!n||!(t>0)||!d)return alert('Faltan nombre, monto o fecha límite.');if(m>t)return alert('La meta mínima no puede superar el monto total.');
 if(id){Object.assign(S.goals.find(x=>x.id===id),{name:n,target:t,min:m,due:d,color:CC})}else S.goals.push({id:uid(),name:n,target:t,min:m,due:d,color:CC,adds:[]});
 save();$('#m').close();render()}
function rgl(id){if(!confirm('¿Eliminar este sueño y sus abonos? No se puede recuperar.'))return;S.goals=S.goals.filter(x=>x.id!==id);save();$('#m').close();render()}
function openA(id){$('#mf').innerHTML=`<h3>Nuevo abono</h3><label>Monto (S/)<input id=am type=number min=0.01 step=any></label><label>Fecha<input id=ad type=date value="${lima()}"></label><label>Nota (opcional)<input id=an></label><div class=g2><button onclick="svA('${id}')">Guardar</button><button class=sec onclick="$('#m').close()">Cerrar</button></div>`;$('#m').showModal()}
function svA(id){const a=+$('#am').value,d=$('#ad').value;if(!(a>0)||!d)return alert('Escribe un monto y una fecha.');const g=S.goals.find(x=>x.id===id);g.adds=g.adds||[];g.adds.push({id:uid(),date:d,amt:a,note:$('#an').value.trim()});save();$('#m').close();render()}
function da(g,a){if(!confirm('¿Borrar este abono?'))return;const x=S.goals.find(y=>y.id===g);x.adds=x.adds.filter(y=>y.id!==a);save();render()}
let lastSc='';function scrollTl(){if(lastSc===cur)return;lastSc=cur;const el=$('.now')||$('.bk')||document.querySelectorAll('.hr')[6];if(el)setTimeout(()=>el.scrollIntoView({block:'center'}),60)}
function render(){$('#ttl').innerHTML=view==='sg'?'<b>Mis sueños 💜</b>':`<b>${lbl(cur)}</b>`;document.querySelectorAll('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));({tl,db,st,sg})[view]();if(view==='tl')scrollTl();chip()}
$('#prev').onclick=()=>{cur=clamp(addD(cur,-1));view='tl';render()};$('#next').onclick=()=>{cur=clamp(addD(cur,1));view='tl';render()};
$('#today').onclick=()=>{cur=clamp(lima());view='tl';render()};$('#add').onclick=()=>view==='sg'?openG():openF();$('#sync').onclick=sync;
document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
let MV=null,lt={id:'',t:0},dg=null,ptm,ttm;
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function toast(msg,fn){const t=$('#tst');t.innerHTML=esc(msg)+(fn?' <button id=und>Deshacer</button>':'');t.style.display='block';if(fn)$('#und').onclick=()=>{fn();t.style.display='none'};clearTimeout(ttm);ttm=setTimeout(()=>t.style.display='none',6000)}
function commit(d){const a=get(d.id),o={...a},m0=mins(a.start),dur=a.end?mins(a.end)-m0:0;let n=m0+Math.round(d.dy/HP*60/5)*5;n=Math.max(0,Math.min(n,1439-dur));
 const ns=hm(n),ne=a.end?hm(n+dur):'';MV=null;if(ns===a.start){render();return}
 if(dup({...a,start:ns},a.id)){alert('Ya hay una actividad igual a esa hora.');render();return}
 a.start=ns;a.end=ne;a.resched=(a.resched||0)+1;a.orig=a.orig||o.date+' '+o.start;touch(a);log(o,a,'Movida en la agenda');render();
 toast('Movida a las '+ft(ns),()=>{const p={...a};Object.assign(a,{start:o.start,end:o.end,resched:o.resched||0,orig:o.orig||''});touch(a);log(p,a,'Movimiento deshecho');render()})}
$('#v').addEventListener('pointerdown',e=>{const b=e.target.closest('.bk');if(!b||e.target.closest('.ck')||MV!==b.dataset.id)return;e.preventDefault();b.setPointerCapture(e.pointerId);
 dg={id:b.dataset.id,b,y0:e.clientY+scrollY,cy:e.clientY,dy:0,moved:0};dg.iv=setInterval(()=>{if(!dg)return;if(dg.cy>innerHeight-120)scrollBy(0,14);else if(dg.cy<190)scrollBy(0,-14);dg.dy=dg.cy+scrollY-dg.y0;dg.b.style.transform=`translateY(${dg.dy}px)`},30)});

 const b=e.target.closest('.bk');if(!b||e.target.closest('.ck'))return;const id=b.dataset.id,n=Date.now();
 if(lt.id===id&&n-lt.t<350){clearTimeout(ptm);lt={id:'',t:0};MV=id;render();toast('Arrastra el bloque a la hora nueva');return}
 lt={id,t:n};clearTimeout(ptm);ptm=setTimeout(()=>{if(MV!==id)openF(id)},350)});
