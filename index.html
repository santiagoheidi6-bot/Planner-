<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#150d26"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Planner 2026</title>
<style>
:root{--bg:#150d26;--p1:#2a1b4a;--p2:#4c2f8a;--p3:#8b5cf6;--p4:#c4b5fd;--p5:#ede9fe;--mu:#a99bd0;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--p5);font:15px/1.4 system-ui,sans-serif;padding:0 0 90px}
header{position:sticky;top:0;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--p1);z-index:5}
.r{display:flex;align-items:center;justify-content:space-between;gap:8px}#ttl{text-align:center;text-transform:capitalize;font-size:16px}
button{background:var(--p2);color:#fff;border:0;border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}button.sec{background:var(--p1);color:var(--p4)}button.dng{background:none;color:var(--p4);border:1px solid var(--p2);width:100%;margin-top:8px}
.chip{font-size:12px;color:var(--p4);background:var(--p1);border-radius:20px;padding:6px 10px}
main{padding:12px 14px;max-width:640px;margin:auto}.note{color:var(--mu);font-size:13px}
.sum,.card{background:var(--p1);border-radius:16px;padding:14px;margin-bottom:12px}.sum b{font-size:26px;color:var(--p4)}.sum small{display:block;color:var(--mu)}
.bar{height:8px;background:#150d26;border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--p4));transition:width .4s}
.it{display:grid;grid-template-columns:62px 20px 1fr 44px;align-items:center;position:relative;padding:8px 0}
.it::before{content:"";position:absolute;left:71px;top:0;bottom:0;width:2px;background:var(--p2)}
.tm{text-align:right;font-size:12px;color:var(--mu);padding-right:6px}.tm small{font-size:11px}
.dc{display:flex;justify-content:center;z-index:1}.dot{width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--p3);transition:.3s}
.bd{background:var(--p1);border-left:3px solid var(--p3);border-radius:10px;padding:8px 10px;margin:0 8px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.nm{font-weight:500}.tg{font-size:11px;color:var(--mu)}.ed{background:none;padding:2px 6px;color:var(--p4)}
.ck{width:36px;height:36px;border-radius:50%;background:none;border:2px solid var(--p3);padding:0;color:#fff;font-size:18px;transition:.25s}
.completada .dot{background:var(--p4);border-color:var(--p4);box-shadow:0 0 12px 3px rgba(196,181,253,.7)}
.completada .ck{background:var(--p3);transform:scale(1.08)}.completada .nm{text-decoration:line-through;opacity:.7}
.cancelada{opacity:.45}.cancelada .nm{text-decoration:line-through}
nav{position:fixed;bottom:0;left:0;right:0;background:#1d1236;display:flex;justify-content:space-around;padding:8px;border-top:1px solid var(--p1);z-index:6}
nav button{background:none;color:var(--mu)}nav button.on{color:var(--p4)}nav .add{background:var(--p3);color:#fff;border-radius:24px}
dialog{background:var(--p1);color:var(--p5);border:1px solid var(--p2);border-radius:18px;width:min(92vw,460px);padding:16px;max-height:90vh}dialog::backdrop{background:#000a}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0}input,select,textarea{width:100%;background:var(--bg);color:var(--p5);border:1px solid var(--p2);border-radius:10px;padding:10px;font:inherit;margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kp{background:var(--p1);border-radius:14px;padding:12px}.kp b{font-size:22px;color:var(--p4);display:block}.kp small{color:var(--mu)}
.ch{display:flex;gap:3px;align-items:flex-end;height:110px;overflow-x:auto;padding-top:6px}.cb{flex:1;min-width:8px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.cb i{display:block;width:100%;background:linear-gradient(var(--p4),var(--p2));border-radius:4px 4px 0 0;min-height:2px}.cb small{font-size:9px;color:var(--mu)}
h3{margin:0 0 8px;font-size:15px;color:var(--p4)}details{color:var(--mu)}summary{cursor:pointer;color:var(--p4)}.row{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}
</style></head><body>
<header><div class=r><button class=sec id=prev>‹</button><div id=ttl></div><button class=sec id=next>›</button></div>
<div class=r style="margin-top:8px"><button class=sec id=today>Hoy</button><span class=chip id=sync></span></div></header>
<main id=v></main>
<nav><button data-v=tl>Agenda</button><button class=add id=add>+ Añadir actividad</button><button data-v=db>Dashboard</button><button data-v=st>Ajustes</button></nav>
<dialog id=m><div id=mf></div></dialog>
<script>
const PI='2026-10-29',PF='2026-12-31',K='plannerV1',$=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{acts:[],hist:[],routines:[],url:'',key:'',err:''};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('No se pudo guardar en el dispositivo: '+e)}};
const lima=()=>new Date(Date.now()-5*36e5).toISOString().slice(0,10);
const nowL=()=>new Date(Date.now()-5*36e5).toISOString().slice(0,19)+'-05:00';
const addD=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const dow=d=>new Date(d+'T00:00:00Z').getUTCDay(),wk=d=>addD(d,-((dow(d)+6)%7));
const clamp=d=>d<PI?PI:d>PF?PF:d;
const ft=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return((h%12)||12)+':'+String(m).padStart(2,'0')+(h<12?' a. m.':' p. m.')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lbl=d=>new Date(d+'T12:00:00Z').toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
const get=id=>S.acts.find(x=>x.id===id),cats=()=>[...new Set(S.acts.map(a=>a.cat).filter(Boolean))];
let cur=clamp(lima()),view='tl',dr='dia',dc='',tmr,busy=0;
const sortF=(a,b)=>a.start.localeCompare(b.start)||(a.end||'').localeCompare(b.end||'')||a.created.localeCompare(b.created);
const day=d=>S.acts.filter(a=>a.date===d).sort(sortF);
function calc(L){const t=L.length,can=L.filter(a=>a.status==='cancelada').length,done=L.filter(a=>a.status==='completada').length,comp=t-can;
 return{tot:t,can,done,comp,pend:comp-done,res:L.filter(a=>a.resched>0).length,unp:L.filter(a=>a.type==='imprevista').length,pct:comp?Math.round(done/comp*100):null}}
const pt=m=>m.pct==null?'Sin datos':m.pct+' %';
function touch(x){x.v=(x.v||0)+1;x.d=1;save();clearTimeout(tmr);tmr=setTimeout(sync,1500)}
function log(o,a,reason){if(o.date===a.date&&o.start===a.start&&o.status===a.status)return;
 S.hist.push({hid:uid(),id:a.id,at:nowL(),oldT:o.date+' '+o.start,newT:a.date+' '+a.start,oldS:o.status,newS:a.status,reason:reason||'',d:1});save()}
function tg(id){const a=get(id);if(a.status==='cancelada')return;
 if(a.date<lima()&&!confirm('Este día ya pasó. ¿Cambiar el check?'))return;
 const o={...a};a.status=a.status==='completada'?'pendiente':'completada';a.doneAt=a.status==='completada'?nowL():'';touch(a);log(o,a,'');render()}
function cn(id){if(!confirm('¿Cancelar esta actividad? No contará como incumplida.'))return;const a=get(id),o={...a};a.status='cancelada';touch(a);log(o,a,'Cancelada');$('#m').close();render()}
const row=a=>{const tags=[a.type==='imprevista'?'imprevista':'',a.resched>0&&a.status==='pendiente'?'reprogramada':'',a.status==='cancelada'?'cancelada':'',a.cat].filter(Boolean).join(' · ');
 return`<div class="it ${a.status}"><div class=tm>${ft(a.start)}${a.end?'<br><small>'+ft(a.end)+'</small>':''}</div><div class=dc><span class=dot></span></div><div class=bd><div><div class=nm>${esc(a.name)}</div><div class=tg>${esc(tags)}</div></div><button class=ed aria-label=Editar onclick="openF('${a.id}')">✎</button></div><button class=ck aria-label=Completar onclick="tg('${a.id}')">${a.status==='completada'?'✓':''}</button></div>`};
function tl(){const L=day(cur),m=calc(L),past=cur<lima();
 const names=(f)=>L.filter(f).map(a=>esc(a.name)).join(', ')||'—';
 $('#v').innerHTML=`<div class=sum><b>${pt(m)}</b><small>${m.done} de ${m.comp} completadas${m.unp?' · '+m.unp+' imprevistas':''}</small><div class=bar><i style="width:${m.pct||0}%"></i></div></div>`+(past?'<p class=note>Día pasado: te pediré confirmar antes de cambiar un check.</p>':'')+
 (L.length?L.map(row).join(''):'<p class=note>Sin actividades. Pulsa «+ Añadir actividad».</p>')+
 (L.length?`<details class=card style="margin-top:12px"><summary>Resumen del día</summary><p class=note>Completadas: ${names(a=>a.status==='completada')}<br>Pendientes: ${names(a=>a.status==='pendiente')}<br>Imprevistos: ${names(a=>a.type==='imprevista')}<br>Reprogramadas: ${names(a=>a.resched>0)}<br>Cada día es una oportunidad para aprender y ajustar tu plan.</p></details>`:'')}
function rng(){if(dr==='dia')return[cur,cur];if(dr==='sem'){const a=wk(cur);return[a,addD(a,6)]}if(dr==='mes')return[cur.slice(0,7)+'-01',cur.slice(0,7)+'-31'];return[PI,PF]}
const bars=I=>`<div class=ch>${I.map(i=>`<div class=cb title="${i.l}: ${i.p==null?'Sin datos':i.p+' %'}"><i style="height:${i.p||0}%"></i>${I.length<=14?'<small>'+i.l+'</small>':''}</div>`).join('')}</div>`;
function db(){const base=S.acts.filter(x=>!dc||(x.cat||'Sin categoría')===dc),[a,b]=rng(),L=base.filter(x=>x.date>=a&&x.date<=b),m=calc(L),P=calc(base);
 const days=[];for(let d=a<PI?PI:a;d<=(b>PF?PF:b)&&days.length<70;d=addD(d,1))days.push(d);
 const dayI=days.map(d=>({l:d.slice(8),p:calc(base.filter(x=>x.date===d)).pct}));
 const weeks=[];for(let w=wk(PI),i=1;w<=PF;w=addD(w,7),i++)weeks.push({l:'S'+i,p:calc(base.filter(x=>x.date>=w&&x.date<=addD(w,6))).pct});
 const mon=[['2026-10','Oct'],['2026-11','Nov'],['2026-12','Dic']].map(([k,l])=>({l,p:calc(base.filter(x=>x.date.startsWith(k))).pct}));
 const g={};S.acts.filter(x=>x.date>=a&&x.date<=b).forEach(x=>(g[x.cat||'Sin categoría']=g[x.cat||'Sin categoría']||[]).push(x));
 const cl=Object.entries(g).map(([k,v])=>[k,calc(v)]).sort((x,y)=>(y[1].pct||-1)-(x[1].pct||-1));
 $('#v').innerHTML=`<div class=g2><select onchange="dr=this.value;render()">${[['dia','Día'],['sem','Semana'],['mes','Mes'],['per','Periodo completo']].map(([k,l])=>`<option value=${k} ${dr===k?'selected':''}>${l}</option>`).join('')}</select><select onchange="dc=this.value;render()"><option value="">Todas las categorías</option>${[...cats(),'Sin categoría'].map(c=>`<option ${dc===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div style="height:10px"></div>
 <div class=g3><div class=kp><b>${pt(m)}</b><small>Cumplimiento</small></div><div class=kp><b>${pt(P)}</b><small>Acumulado 29 oct–31 dic</small></div><div class=kp><b>${m.comp}</b><small>Planificadas (computables)</small></div><div class=kp><b>${m.done}</b><small>Completadas</small></div><div class=kp><b>${m.pend}</b><small>Pendientes</small></div><div class=kp><b>${m.res}</b><small>Reprogramadas</small></div><div class=kp><b>${m.can}</b><small>Canceladas</small></div><div class=kp><b>${m.unp}</b><small>Imprevistas</small></div></div>
 <div class=card><h3>Planificadas vs completadas</h3><div class=row><span>Computables</span><span>${m.comp}</span></div><div class=bar><i style="width:${m.comp?100:0}%"></i></div><div class=row><span>Completadas</span><span>${m.done}</span></div><div class=bar><i style="width:${m.pct||0}%"></i></div></div>
 <div class=card><h3>Evolución diaria</h3>${bars(dayI)}</div><div class=card><h3>Semanas</h3>${bars(weeks)}</div><div class=card><h3>Meses</h3>${bars(mon)}</div>
 <div class=card><h3>Categorías</h3>${cl.map(([k,v])=>`<div class=row><span>${esc(k)}</span><span>${pt(v)}</span></div><div class=bar><i style="width:${v.pct||0}%"></i></div>`).join('')||'<p class=note>Sin datos</p>'}</div>
 <details class=card><summary>¿Cómo se calcula?</summary><p class=note>Computables = actividades no canceladas. Cumplimiento = completadas ÷ computables × 100. Las pendientes no cuentan como completadas; las canceladas salen del denominador. Una actividad reprogramada es un solo registro (cuenta solo en su fecha actual) y se marca como reprogramada. Sin computables se muestra «Sin datos».</p></details>`}
function st(){$('#v').innerHTML=`<div class=card><h3>Google Sheets</h3><label>URL de la aplicación web (Apps Script)<input id=su value="${esc(S.url)}"></label><label>Clave secreta<input id=sk value="${esc(S.key)}"></label><button onclick=ss()>Guardar y sincronizar</button><p class=note>${S.err?'Último error: '+esc(S.err):''}</p></div><div class=card><button class=sec onclick=bk()>Descargar copia JSON</button><p class=note>${S.acts.length} actividades guardadas en este dispositivo.</p></div>`}
async function ss(){S.url=$('#su').value.trim();S.key=$('#sk').value.trim();[S.acts,S.hist,S.routines].forEach(l=>l.forEach(x=>x.d=1));save();await sync();await pull();st()}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='planner-respaldo-'+lima()+'.json';a.click()}
function dup(f,id){return S.acts.some(a=>a.id!==id&&a.date===f.date&&a.start===f.start&&a.name.toLowerCase()===f.name.toLowerCase()&&a.status!=='cancelada')}
function openF(id){const a=id?get(id):null,v=a||{date:cur,start:'',end:'',name:'',cat:'',notes:'',type:'planificada'};
 $('#mf').innerHTML=`<h3>${a?'Editar':'Añadir'} actividad</h3><label>Fecha<input id=fd type=date min=${PI} max=${PF} value=${v.date}></label><div class=g2><label>Inicio<input id=fs type=time value="${v.start}"></label><label>Fin (opcional)<input id=fe type=time value="${v.end||''}"></label></div><label>Actividad<input id=fn value="${esc(v.name)}"></label><label>Categoría (opcional)<input id=fc list=cl value="${esc(v.cat)}"><datalist id=cl>${cats().map(c=>`<option>${esc(c)}`).join('')}</datalist></label><label>Observaciones (opcional)<textarea id=fo>${esc(v.notes)}</textarea></label><label>Tipo<select id=fy><option value=planificada>Planificada<option value=imprevista ${v.type==='imprevista'?'selected':''}>Imprevista</select></label>${a?'<label>Motivo del cambio (opcional)<input id=fr></label>':'<label>Repetir hasta el 31 dic<select id=fp><option value=n>No<option value=d>Todos los días<option value=w>Lunes a viernes<option value=s>Cada semana (mismo día)</select></label>'}<div class=g2><button onclick="sv('${id||''}')">Guardar</button><button class=sec onclick="$('#m').close()">Cerrar</button></div>${a?`<button class=dng onclick="cn('${id}')">Cancelar actividad</button>`:''}`;$('#m').showModal()}
function sv(id){const d=$('#fd').value,s=$('#fs').value,n=$('#fn').value.trim(),e=$('#fe').value;
 if(!d||!s||!n)return alert('Faltan fecha, hora de inicio o nombre.');if(d<PI||d>PF)return alert('Fecha fuera del periodo 29 oct – 31 dic 2026.');if(e&&e<s)return alert('La hora final es anterior al inicio.');
 const f={date:d,start:s,end:e,name:n,cat:$('#fc').value.trim(),notes:$('#fo').value.trim(),type:$('#fy').value};
 if(dup(f,id))return alert('Ya existe esa actividad a esa hora.');
 if(id){const a=get(id),o={...a};Object.assign(a,f);if(o.date!==d||o.start!==s){a.resched=(a.resched||0)+1;a.orig=a.orig||o.date+' '+o.start}touch(a);log(o,a,$('#fr').value)}
 else{const p=$('#fp').value;let ds=[d];if(p!=='n'){ds=[];for(let x=d;x<=PF;x=addD(x,p==='s'?7:1)){const w=dow(x);if(p!=='w'||(w>0&&w<7&&w<6))ds.push(x)}}
  if(p!=='n'){const r={id:uid(),name:n,start:s,end:e,days:p==='d'?[0,1,2,3,4,5,6]:p==='w'?[1,2,3,4,5]:[dow(d)],from:d,to:PF,status:'activa',d:1,v:1};S.routines.push(r)}
  ds.forEach(x=>{const nf={...f,date:x};if(dup(nf))return;const a={id:uid(),...nf,status:'pendiente',created:nowL(),doneAt:'',resched:0,orig:''};S.acts.push(a);touch(a)});cur=clamp(d)}
 save();$('#m').close();render()}
const pend=()=>S.acts.filter(x=>x.d).length+S.hist.filter(x=>x.d).length+S.routines.filter(x=>x.d).length;
function chip(t){const n=pend(),c=$('#sync');c.textContent=t||(!S.url?'Sin Google Sheets':(S.err||n)?`⏳ ${n} pendiente(s) · reintentar`:'✓ Sincronizado')}
async function sync(){if(!S.url||busy||!navigator.onLine)return chip();
 const A=S.acts.filter(x=>x.d).map(x=>({...x})),H=S.hist.filter(x=>x.d).map(x=>({...x})),R=S.routines.filter(x=>x.d).map(x=>({...x}));
 if(!A.length&&!H.length&&!R.length)return chip();busy=1;chip('Sincronizando…');
 try{const r=await fetch(S.url,{method:'POST',body:JSON.stringify({key:S.key,acts:A,hist:H,routines:R})}),j=await r.json();if(!j.ok)throw j.error||'Error';
  A.forEach(s=>{const x=get(s.id);if(x&&x.v===s.v)x.d=0});H.forEach(s=>{const x=S.hist.find(h=>h.hid===s.hid);if(x)x.d=0});R.forEach(s=>{const x=S.routines.find(h=>h.id===s.id);if(x&&x.v===s.v)x.d=0});S.err='';save()}
 catch(e){S.err=String(e);save()}busy=0;chip()}
async function pull(){if(!S.url||!navigator.onLine)return;
 try{const r=await fetch(S.url+'?key='+encodeURIComponent(S.key)),j=await r.json();if(!j.ok)throw j.error||'Error';
  j.acts.forEach(q=>{const i=S.acts.findIndex(x=>x.id===q.id);if(i>=0&&S.acts[i].d)return;const n={...q,resched:+q.resched||0,v:0,d:0};if(i>=0)S.acts[i]=n;else S.acts.push(n)});
  j.hist.forEach(h=>{if(!S.hist.some(x=>x.hid===h.hid))S.hist.push({...h,d:0})});
  j.routines.forEach(q=>{if(!S.routines.some(x=>x.id===q.id))S.routines.push({...q,d:0,v:0})});S.err='';save();render()}
 catch(e){S.err=String(e);chip()}}
function render(){$('#ttl').innerHTML=`<b>${lbl(cur)}</b>`;document.querySelectorAll('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));({tl,db,st})[view]();chip()}
$('#prev').onclick=()=>{cur=clamp(addD(cur,-1));view='tl';render()};$('#next').onclick=()=>{cur=clamp(addD(cur,1));view='tl';render()};
$('#today').onclick=()=>{cur=clamp(lima());view='tl';render()};$('#add').onclick=()=>openF();$('#sync').onclick=sync;
document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
addEventListener('online',()=>{sync();pull()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();pull().then(sync);
</script></body></html>
